<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Amazon Product Data Space (deck.gl)</title>
    
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- deck.gl Standalone Bundle -->
    <script src="https://unpkg.com/deck.gl@latest/dist.min.js"></script>
</head>
<body>

    <div id="overlay">
        <h3 style="margin-top:0;">3D Product Space</h3>
        <p id="status">Initializing deck.gl...</p>
        <div style="font-size: 11px; color: #aaa;">
            <p>X: Price ($) | Y: Rating (1-5★) | Z: Reviews</p>
            <p>Left Click + Drag: Rotate | Right Click + Drag: Pan | Scroll: Zoom</p>
        </div>
    </div>

    <div id="tooltip"></div>
    <div id="canvas-container"></div>

    <script src="{{ url_for('static', filename='js/visualizer.js') }}"></script>
</body>
</html>
